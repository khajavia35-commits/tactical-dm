
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tactical DM Online</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10151c;color:#eee;font-family:Tahoma,Arial;text-align:center}
header{padding:18px;background:#1b2633;border-bottom:2px solid #65ff9a}
h1{margin:5px;color:#65ff9a}
button,input{padding:12px;margin:5px;border:0;border-radius:7px;font-size:15px}
button{background:#65ff9a;color:#102018;font-weight:bold;cursor:pointer}
input{width:210px;background:#263442;color:white}
#status{color:#ffd166;min-height:28px;padding:8px}
#game{display:none;margin:10px auto;max-width:900px}
canvas{display:block;width:100%;background:#202b32;border:2px solid #65ff9a;border-radius:8px;touch-action:none}
#info{padding:10px}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>TACTICAL DM</h1>
<div>ONLINE ROOM • DEATHMATCH</div>
</header>

<section id="menu">
<h2>ساخت روم یا ورود به روم</h2>
<button onclick="createRoom()">ساخت روم جدید</button>
<br>
<input id="roomCode" placeholder="کد روم دوستت را وارد کن">
<button onclick="joinRoom()">ورود به روم</button>
<div id="status">برای شروع، روم بساز یا کد دوستت را وارد کن.</div>
<p class="small">هر دو بازیکن باید اینترنت و مرورگر به‌روز داشته باشند.</p>
</section>

<section id="game">
<div id="info">سلامتی: <span id="hp">100</span> | حریف: <span id="enemyHp">100</span></div>
<canvas id="screen" width="900" height="520"></canvas>
<p>حرکت: W A S D | نشانه‌گیری: موس | شلیک: کلیک چپ</p>
<button onclick="location.reload()">خروج از بازی</button>
</section>

<script>
const $ = id => document.getElementById(id);
const canvas = $("screen");
const ctx = canvas.getContext("2d");

let peer, conn, isHost=false, connected=false;
let myId="", enemyId="";
let keys={}, mouse={x:450,y:260};
let bullets=[];
let lastShot=0, lastSend=0;
let me={x:150,y:260,hp:100};
let enemy={x:750,y:260,hp:100};
let started=false;

function status(t){$("status").textContent=t;}

function createRoom(){
  if(!window.Peer){status("PeerJS بارگذاری نشد؛ اینترنت را بررسی کن.");return;}
  isHost=true;
  myId="tdm"+Math.random().toString(36).slice(2,10);
  status("در حال ساخت روم...");
  peer=new Peer(myId);
  peer.on("open",id=>{
    myId=id;
    $("roomCode").value=id;
    status("روم ساخته شد! این کد را برای دوستت بفرست: "+id);
  });
  peer.on("connection",c=>{
    if(conn){c.close();return;}
    conn=c; setupConnection();
  });
  peer.on("error",e=>status("خطا: "+e.type+". دوباره امتحان کن."));
}

function joinRoom(){
  if(!window.Peer){status("PeerJS بارگذاری نشد؛ اینترنت را بررسی کن.");return;}
  const code=$("roomCode").value.trim();
  if(!code){status("اول کد روم را وارد کن.");return;}
  isHost=false;
  status("در حال اتصال به روم...");
  peer=new Peer();
  peer.on("open",()=>{
    conn=peer.connect(code,{reliable:true});
    setupConnection();
  });
  peer.on("error",e=>status("خطای اتصال: "+e.type+". کد روم را بررسی کن."));
}

function setupConnection(){
  conn.on("open",()=>{
    connected=true;
    $("menu").style.display="none";
    $("game").style.display="block";
    status("متصل شدی!");
    if(isHost){
      me.x=150;me.y=260;enemy.x=750;enemy.y=260;
    }else{
      me.x=750;me.y=260;enemy.x=150;enemy.y=260;
    }
    conn.send({type:"hello",x:me.x,y:me.y,hp:me.hp});
    started=true;
    requestAnimationFrame(loop);
  });

  conn.on("data",data=>{
    if(!data)return;
    if(data.type==="state"){
      enemy.x=data.x;enemy.y=data.y;enemy.hp=data.hp;
      $("enemyHp").textContent=enemy.hp;
    }
    if(data.type==="bullet"){
      bullets.push({x:data.x,y:data.y,vx:data.vx,vy:data.vy,owner:"enemy",life:100});
    }
    if(data.type==="hit"){
      me.hp=Math.max(0,me.hp-10);
      $("hp").textContent=me.hp;
      if(me.hp<=0)status("باختی! برای بازی دوباره صفحه را تازه کن.");
    }
    if(data.type==="hello"){
      enemy.x=data.x;enemy.y=data.y;enemy.hp=data.hp;
    }
  });

  conn.on("close",()=>{
    connected=false;
    status("ارتباط قطع شد. برای اتصال دوباره صفحه را تازه کن.");
  });
  conn.on("error",()=>status("در ارتباط خطا رخ داد."));
}

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(["w","a","s","d"," "].includes(e.key.toLowerCase()))e.preventDefault();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*canvas.width/r.width;
  mouse.y=(e.clientY-r.top)*canvas.height/r.height;
}
canvas.addEventListener("mousemove",pointerPos);
canvas.addEventListener("mousedown",e=>{
  pointerPos(e);
  if(e.button===0)shoot();
});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

function shoot(){
  if(!connected||me.hp<=0)return;
  const now=Date.now();
  if(now-lastShot<250)return;
  lastShot=now;
  const dx=mouse.x-me.x,dy=mouse.y-me.y;
  const len=Math.hypot(dx,dy)||1;
  const b={x:me.x,y:me.y,vx:dx/len*8,vy:dy/len*8,owner:"me",life:100};
  bullets.push(b);
  conn.send({type:"bullet",x:b.x,y:b.y,vx:b.vx,vy:b.vy});
}

function loop(){
  if(!started)return;
  const speed=3.4;
  if(me.hp>0){
    if(keys.w)me.y-=speed;
    if(keys.s)me.y+=speed;
    if(keys.a)me.x-=speed;
    if(keys.d)me.x+=speed;
  }
  me.x=Math.max(18,Math.min(882,me.x));
  me.y=Math.max(18,Math.min(502,me.y));

  for(const b of bullets){
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.owner==="me"&&Math.hypot(b.x-enemy.x,b.y-enemy.y)<20&&enemy.hp>0){
      b.life=0;
      conn.send({type:"hit"});
    }
  }
  bullets=bullets.filter(b=>b.life>0&&b.x>=0&&b.x<=900&&b.y>=0&&b.y<=520);

  if(Date.now()-lastSend>50&&connected){
    conn.send({type:"state",x:me.x,y:me.y,hp:me.hp});
    lastSend=Date.now();
  }
  draw();
  requestAnimationFrame(loop);
}

function drawPlayer(p,color,label){
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(p.x,p.y,17,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="white";ctx.font="13px Tahoma";
  ctx.textAlign="center";ctx.fillText(label,p.x,p.y-25);
  ctx.fillStyle="#333";
  ctx.fillRect(p.x-20,p.y+23,40,5);
  ctx.fillStyle="#65ff9a";
  ctx.fillRect(p.x-20,p.y+23,40*Math.max(0,p.hp)/100,5);
}

function draw(){
  ctx.clearRect(0,0,900,520);
  ctx.fillStyle="#202b32";ctx.fillRect(0,0,900,520);
  ctx.strokeStyle="#33434b";ctx.lineWidth=1;
  for(let x=0;x<900;x+=40){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,520);ctx.stroke();
  }
  for(let y=0;y<520;y+=40){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke();
  }
  // موانع نقشه
  ctx.fillStyle="#52616b";
  ctx.fillRect(330,100,90,45);
  ctx.fillRect(500,360,90,45);
  ctx.fillRect(430,220,35,80);

  drawPlayer(me,"#65ff9a","شما");
  drawPlayer(enemy,"#ff595e","حریف");

  for(const b of bullets){
    ctx.fillStyle=b.owner==="me"?"#ffe66d":"#ff8a5b";
    ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle="white";ctx.textAlign="left";ctx.font="14px Tahoma";
  ctx.fillText(connected?"CONNECTED":"WAITING",15,25);
}
</script>
</body>
</html>
